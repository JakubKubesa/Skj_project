<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MUJ CLOUDIK</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
  </head>
  <body>
    <main id="authView" class="auth-page">
      <section class="auth-panel">
        <div class="brand-mark">MC</div>
        <h1>MUJ CLOUDIK</h1>
        <p class="text-secondary mb-4">Osobni cloud pro obrazky, upravy pres worker a prehledny billing.</p>

        <ul class="nav nav-pills auth-tabs mb-4" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">Prihlaseni</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="pill" data-bs-target="#registerPane" type="button">Registrace</button>
          </li>
        </ul>

        <div id="authAlert" class="alert d-none" role="alert"></div>

        <div class="tab-content">
          <div id="loginPane" class="tab-pane fade show active">
            <form id="loginForm" class="vstack gap-3">
              <div>
                <label class="form-label" for="loginUsername">Uzivatelske jmeno</label>
                <input id="loginUsername" class="form-control form-control-lg" name="username" autocomplete="username" required>
              </div>
              <div>
                <label class="form-label" for="loginPassword">Heslo</label>
                <input id="loginPassword" class="form-control form-control-lg" name="password" type="password" autocomplete="current-password" required>
              </div>
              <button class="btn btn-cloud btn-lg" type="submit">
                <i class="bi bi-box-arrow-in-right"></i>
                Prihlasit
              </button>
            </form>
          </div>

          <div id="registerPane" class="tab-pane fade">
            <form id="registerForm" class="vstack gap-3">
              <div>
                <label class="form-label" for="registerUsername">Uzivatelske jmeno</label>
                <input id="registerUsername" class="form-control form-control-lg" name="username" autocomplete="username" required minlength="3">
              </div>
              <div>
                <label class="form-label" for="registerPassword">Heslo</label>
                <input id="registerPassword" class="form-control form-control-lg" name="password" type="password" autocomplete="new-password" required minlength="6">
              </div>
              <button class="btn btn-cloud btn-lg" type="submit">
                <i class="bi bi-person-plus"></i>
                Vytvorit ucet
              </button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <main id="appView" class="app-page d-none">
      <nav class="navbar navbar-expand-lg cloud-nav">
        <div class="container-fluid px-4">
          <span class="navbar-brand mb-0 h1">
            <span class="brand-dot">MC</span>
            MUJ CLOUDIK
          </span>
          <div class="d-flex align-items-center gap-3">
            <span id="signedUser" class="signed-user"></span>
            <button id="logoutBtn" class="btn btn-outline-secondary">
              <i class="bi bi-box-arrow-right"></i>
              Odhlasit
            </button>
          </div>
        </div>
      </nav>

      <div class="container-fluid px-4 py-4">
        <div id="appAlert" class="alert d-none" role="alert"></div>

        <ul class="nav nav-tabs cloud-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#picturesPane" type="button">
              <i class="bi bi-images"></i>
              Obrazky
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#billingPane" type="button">
              <i class="bi bi-receipt"></i>
              Billing a ucet
            </button>
          </li>
        </ul>

        <div class="tab-content pt-4">
          <section id="picturesPane" class="tab-pane fade show active">
            <div class="row g-4">
              <aside class="col-12 col-xl-3">
                <div class="tool-panel">
                  <h2>Upload picture</h2>
                  <form id="uploadForm" class="vstack gap-3">
                    <div>
                      <label class="form-label" for="pictureFile">Soubor</label>
                      <input id="pictureFile" class="form-control" name="file" type="file" accept="image/*" required>
                    </div>
                    <div>
                      <label class="form-label" for="objectKey">Nazev objektu</label>
                      <input id="objectKey" class="form-control" name="objectKey" placeholder="napr. portret.png">
                    </div>
                    <button class="btn btn-cloud" type="submit">
                      <i class="bi bi-cloud-arrow-up"></i>
                      Nahrat obrazek
                    </button>
                  </form>
                </div>
              </aside>

              <section class="col-12 col-xl-9">
                <div class="section-heading">
                  <div>
                    <h2>Moje obrazky</h2>
                    <p id="galleryMeta" class="text-secondary mb-0"></p>
                  </div>
                  <button id="refreshBtn" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i>
                    Obnovit
                  </button>
                </div>
                <div id="gallery" class="gallery-grid"></div>
              </section>
            </div>
          </section>

          <section id="billingPane" class="tab-pane fade">
            <div class="row g-4">
              <div class="col-12 col-lg-4">
                <div class="info-panel">
                  <h2>Uzivatel</h2>
                  <dl class="info-list">
                    <dt>Jmeno</dt>
                    <dd id="profileUsername"></dd>
                    <dt>Bucket</dt>
                    <dd id="profileBucket"></dd>
                  </dl>
                </div>
              </div>
              <div class="col-12 col-lg-8">
                <div id="billingGrid" class="billing-grid"></div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
